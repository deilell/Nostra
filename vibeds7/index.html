<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>四个孩子</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1920px; height:1080px; overflow:hidden; background:#07080a; }
  #stage { position:absolute; inset:0; overflow:hidden; background:#07080a;
    font-family:"PingFang SC","Noto Sans CJK SC","Source Han Sans SC","Microsoft YaHei",sans-serif; }

  /* four horizontal bands, one life each */
  .band { position:absolute; left:0; width:1920px; height:262px; overflow:hidden; }
  #b1 { top:0px;    }
  #b2 { top:268px;  }
  #b3 { top:536px;  }
  #b4 { top:804px;  }

  /* separation lines between lives */
  .seam { position:absolute; left:0; width:1920px; height:6px; background:#000; z-index:50; }
  .seam.glow { box-shadow:0 0 24px 4px rgba(0,0,0,0.9); }

  /* ---------- band 1: white house, warm ---------- */
  #b1 { background:linear-gradient(180deg,#e8e2d6 0%,#ddd5c6 60%,#cfc6b4 100%); }
  #b1 .floor { position:absolute; left:0; bottom:0; width:1920px; height:58px;
    background:linear-gradient(180deg,#b8a58a 0%,#a08c6e 100%); }
  #b1 .wall { position:absolute; left:0; top:0; width:1920px; height:210px;
    background:linear-gradient(180deg,#efeade 0%,#e4dccd 100%); }
  #b1 .light { position:absolute; left:900px; top:0; width:1100px; height:270px;
    background:radial-gradient(ellipse 620px 210px at 60% 10%, rgba(255,240,200,0.55), rgba(255,240,200,0) 72%); }
  #b1 .piano { position:absolute; left:120px; bottom:58px; width:300px; height:130px;
    background:#2a2622; border-radius:4px; }
  #b1 .piano .keys { position:absolute; left:8px; top:26px; width:284px; height:38px;
    background:repeating-linear-gradient(90deg,#f4f1e8 0px,#f4f1e8 13px,#2a2622 13px,#2a2622 15px); }
  #b1 .shelf { position:absolute; left:1180px; top:74px; width:360px; height:9px; background:#8d7a5f; }
  #b1 .book { position:absolute; bottom:9px; width:22px; border-radius:1px; }
  #b1 .rail { position:absolute; left:700px; top:150px; width:620px; height:7px;
    background:linear-gradient(180deg,#cbbfa6,#9d8f74); border-radius:4px; }
  #b1 .railp { position:absolute; top:157px; width:9px; height:52px; background:#b6a88c; }
  #b1 .sun { position:absolute; left:1580px; top:26px; width:150px; height:150px; border-radius:50%;
    background:radial-gradient(circle, rgba(255,232,176,0.95), rgba(255,232,176,0.10) 68%, rgba(255,232,176,0) 78%); }

  /* ---------- band 2: old stairwell, cold green ---------- */
  #b2 { background:linear-gradient(180deg,#232a28 0%,#1a201e 70%,#141917 100%); }
  #b2 .wall { position:absolute; left:0; top:0; width:1920px; height:200px;
    background:repeating-linear-gradient(180deg,#232a28 0px,#232a28 58px,#1e2523 58px,#1e2523 60px); }
  #b2 .stair { position:absolute; left:820px; bottom:0; width:1100px; height:262px;
    background:linear-gradient(135deg,#1b2321 0%,#121816 100%); }
  #b2 .step { position:absolute; background:#2b3330; }
  #b2 .pipe { position:absolute; left:0; top:34px; width:1920px; height:8px; background:#2e3733; }
  #b2 .meter { position:absolute; left:1420px; top:60px; width:74px; height:96px;
    background:#39423d; border:2px solid #2a322e; border-radius:3px; }
  #b2 .bulb { position:absolute; left:600px; top:2px; width:16px; height:16px; border-radius:50%;
    background:#ffe9a8; box-shadow:0 0 26px 8px rgba(255,220,140,0.45); }
  #b2 .cone { position:absolute; left:480px; top:14px; width:260px; height:250px;
    background:radial-gradient(ellipse 130px 240px at 50% 0%, rgba(255,225,150,0.22), rgba(255,225,150,0) 70%); }
  #b2 .door { position:absolute; left:250px; bottom:0; width:180px; height:200px;
    background:#161c1a; border:3px solid #2b3330; }

  /* ---------- band 3: tin shack, grey blue ---------- */
  #b3 { background:linear-gradient(180deg,#2b3038 0%,#242830 70%,#1d2127 100%); }
  #b3 .sheet { position:absolute; top:0; width:150px; height:262px;
    background:linear-gradient(90deg,#4a505a,#3a3f47); }
  #b3 .rib { position:absolute; top:0; width:2px; height:262px; background:rgba(255,255,255,0.05); }
  #b3 .tarp { position:absolute; left:-20px; top:-18px; width:760px; height:120px;
    background:linear-gradient(180deg, rgba(120,140,150,0.30), rgba(120,140,150,0.06));
    filter:blur(1px); }
  #b3 .ground { position:absolute; left:0; bottom:0; width:1920px; height:56px; background:#171b20; }
  #b3 .puddle { position:absolute; left:0; bottom:10px; width:1920px; height:40px;
    background:radial-gradient(ellipse 900px 26px at 40% 60%, rgba(150,175,190,0.10), rgba(0,0,0,0) 72%); }
  #b3 .crate { position:absolute; bottom:56px; width:120px; height:92px;
    background:#3a3228; border-radius:2px; }
  #b3 .crate .tape { position:absolute; left:0; top:34px; width:120px; height:8px; background:rgba(200,180,140,0.20); }
  #b3 .cord { position:absolute; left:900px; top:0; width:3px; height:96px; background:#4a5560; }

  /* ---------- band 4: convenience store back door, magenta ---------- */
  #b4 { background:linear-gradient(180deg,#1a1420 0%,#140f1c 70%,#0e0a16 100%); }
  #b4 .back { position:absolute; left:0; top:0; width:1920px; height:262px;
    background:linear-gradient(180deg,#1a1420,#120d1a); }
  #b4 .neon { position:absolute; left:1180px; top:22px; width:420px; height:14px; border-radius:7px;
    background:#ff4fa8; box-shadow:0 0 22px 6px rgba(255,79,168,0.55), 0 0 60px 16px rgba(255,79,168,0.20); }
  #b4 .neon2 { position:absolute; left:1260px; top:52px; width:260px; height:9px; border-radius:5px;
    background:#5fe0ff; box-shadow:0 0 18px 5px rgba(95,224,255,0.45); }
  #b4 .shutter { position:absolute; left:120px; bottom:0; width:420px; height:212px;
    background:repeating-linear-gradient(180deg,#2a2230 0px,#2a2230 13px,#221b28 13px,#221b28 15px); }
  #b4 .shutter .lip { position:absolute; left:0; bottom:0; width:420px; height:14px; background:#141020; }
  #b4 .asphalt { position:absolute; left:0; bottom:0; width:1920px; height:50px; background:#0f0b16; }
  #b4 .spill { position:absolute; left:900px; bottom:40px; width:900px; height:110px;
    background:radial-gradient(ellipse 420px 60px at 40% 60%, rgba(255,79,168,0.16), rgba(255,79,168,0) 72%); }
  #b4 .box { position:absolute; bottom:50px; width:96px; height:74px; background:#2f2438; border-radius:2px; }

  /* ---------- the children (stick figures) ---------- */
  .kid { position:absolute; z-index:20; }
  .kid .head { position:absolute; border-radius:50%; }
  .kid .body { position:absolute; border-radius:3px; }
  .kid .leg { position:absolute; border-radius:3px; transform-origin:50% 0; }
  .kid .arm { position:absolute; border-radius:3px; transform-origin:50% 0; }
  .kid .shadow { position:absolute; border-radius:50%; filter:blur(4px); }

  /* ---------- subtitles ---------- */
  #subs { position:absolute; left:0; bottom:0; width:1920px; z-index:80; }
  #l1 { position:absolute; left:0; width:1920px; text-align:center; opacity:0;
    font-size:52px; font-weight:700; letter-spacing:2px; color:#fff;
    text-shadow:0 0 18px rgba(0,0,0,0.95), 0 3px 10px rgba(0,0,0,0.95), 0 0 42px rgba(0,0,0,0.8); }

  /* ---------- grade ---------- */
  #vignette { position:absolute; inset:0; z-index:70; pointer-events:none;
    background:radial-gradient(ellipse 1300px 760px at 50% 50%, rgba(0,0,0,0) 40%, rgba(0,0,0,0.55) 100%); }
  #grain { position:absolute; inset:0; z-index:72; pointer-events:none; opacity:0.05; }
  #black { position:absolute; inset:0; z-index:95; background:#000; opacity:1; }
</style>
</head>
<body>
<div id="stage" data-composition-id="main" data-width="1920" data-height="1080" data-duration="45">

  <div class="band" id="b1"></div>
  <div class="band" id="b2"></div>
  <div class="band" id="b3"></div>
  <div class="band" id="b4"></div>

  <div class="seam" id="s1" style="top:262px"></div>
  <div class="seam" id="s2" style="top:530px"></div>
  <div class="seam" id="s3" style="top:798px"></div>

  <div id="kids"></div>

  <div id="subs"><div id="l1"></div></div>

  <div id="vignette"></div>
  <div id="grain"></div>
  <div id="black"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script>
(function () {
  var DUR = 45;

  /* seeded PRNG: identical pixels on every render pass */
  var __seed = 0x2545f491;
  function srnd() {
    __seed |= 0; __seed = (__seed + 0x6D2B79F5) | 0;
    var t = Math.imul(__seed ^ (__seed >>> 15), 1 | __seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  function rnd(a, b) { return a + srnd() * (b - a); }
  function $(id) { return document.getElementById(id); }

  function mk(tag, css, host, cls) {
    var d = document.createElement(tag);
    for (var k in css) d.style[k] = css[k];
    if (cls) d.className = cls;
    if (host) host.appendChild(d);
    return d;
  }

  var B = { b1: $('b1'), b2: $('b2'), b3: $('b3'), b4: $('b4') };
  var BANDTOP = { 1: 0, 2: 268, 3: 536, 4: 804 };
  var BANDH = 262;

  /* ============ band 1 decoration: white room, piano, sunlight, rail ============ */
  (function decorate1() {
    var h = B.b1;
    mk('div', {}, h, 'wall');
    mk('div', {}, h, 'light');
    mk('div', {}, h, 'sun');
    var piano = mk('div', {}, h, 'piano');
    mk('div', {}, piano, 'keys');
    var floor = mk('div', {}, h, 'floor');
    /* bookshelf with books whose heights encode "how much is given to you" */
    mk('div', {}, h, 'shelf');
    var shelf = h.querySelector('.shelf');
    var cols = ['#8c5a4a', '#4a6a8c', '#7a7a4a', '#6a4a7a', '#4a7a6a'];
    for (var i = 0; i < 14; i++) {
      mk('div', {
        left: (6 + i * 25) + 'px',
        height: rnd(52, 86) + 'px',
        background: cols[i % cols.length]
      }, shelf, 'book');
    }
    mk('div', {}, h, 'rail');
    mk('div', { left: '700px' }, h, 'railp');
    mk('div', { left: '1300px' }, h, 'railp');
  })();

  /* ============ band 2 decoration: stairwell, bulb, meter, pipe ============ */
  (function decorate2() {
    var h = B.b2;
    mk('div', {}, h, 'wall');
    var stair = mk('div', {}, h, 'stair');
    for (var i = 0; i < 9; i++) {
      mk('div', {
        left: (i * 46) + 'px',
        bottom: (i * 27) + 'px',
        width: '120px',
        height: '27px',
        background: i % 2 ? '#2b3330' : '#252d2a'
      }, stair, 'step');
    }
    mk('div', {}, h, 'pipe');
    mk('div', {}, h, 'meter');
    mk('div', {}, h, 'door');
    mk('div', {}, h, 'cone');
    mk('div', {}, h, 'bulb');
  })();

  /* ============ band 3 decoration: corrugated sheet wall, tarp, crates ============ */
  (function decorate3() {
    var h = B.b3;
    for (var i = 0; i < 12; i++) {
      var s = mk('div', { left: (i * 150) + 'px' }, h, 'sheet');
      for (var r = 0; r < 5; r++) mk('div', { left: (r * 30 + 12) + 'px' }, s, 'rib');
    }
    mk('div', {}, h, 'tarp');
    mk('div', {}, h, 'ground');
    mk('div', {}, h, 'puddle');
    mk('div', { left: '1180px' }, h, 'crate');
    mk('div', { left: '1180px', bottom: '148px' }, h, 'crate');
    mk('div', {}, h, 'cord');
    /* a bare bulb on a cord: the only light this house owns */
    mk('div', {
      left: '901px', top: '96px', width: '12px', height: '12px', borderRadius: '50%',
      background: '#ffe6b0', boxShadow: '0 0 22px 7px rgba(255,215,140,0.40)',
      position: 'absolute'
    }, h);
  })();

  /* ============ band 4 decoration: shutters, neon, boxes ============ */
  (function decorate4() {
    var h = B.b4;
    mk('div', {}, h, 'back');
    mk('div', {}, h, 'spill');
    mk('div', {}, h, 'asphalt');
    mk('div', {}, h, 'neon');
    mk('div', {}, h, 'neon2');
    var sh = mk('div', {}, h, 'shutter');
    mk('div', {}, sh, 'lip');
    mk('div', { left: '980px' }, h, 'box');
    mk('div', { left: '1040px', bottom: '124px' }, h, 'box');
  })();
  
  /* ---- id pass: the timeline addresses these by '#id' ---- */
  ['sun', 'bulb', 'neon', 'neon2', 'shutter'].forEach(function (c, i) {
    var hosts = ['b1', 'b2', 'b4', 'b4', 'b4'];
    var host = $(hosts[i]);
    var el = host ? host.querySelector('.' + c) : null;
    if (el) el.id = c;
  });


  /* ============ helper: build one stick child ============ */
  function buildKid(opt) {
    var el = mk('div', {}, $('kids'), 'kid');
    el.style.left = opt.x + 'px';
    el.style.top = opt.y + 'px';
    el.style.width = opt.w + 'px';
    el.style.height = opt.h + 'px';
    var c = opt.color;
    var lw = opt.limb;

    var shadow = mk('div', {
      left: (opt.w * 0.5 - 34) + 'px', top: (opt.h - 8) + 'px',
      width: '68px', height: '14px',
      background: opt.shadow || 'rgba(0,0,0,0.35)'
    }, el, 'shadow');

    var hipY = opt.h * 0.52, neckY = opt.h * 0.30;
    var headR = opt.w * 0.26;

    var legL = mk('div', {
      left: (opt.w * 0.50 - lw / 2 - 5) + 'px', top: hipY + 'px',
      width: lw + 'px', height: (opt.h - hipY - 6) + 'px', background: c
    }, el, 'leg');
    var legR = mk('div', {
      left: (opt.w * 0.50 - lw / 2 + 5) + 'px', top: hipY + 'px',
      width: lw + 'px', height: (opt.h - hipY - 6) + 'px', background: c
    }, el, 'leg');

    var body = mk('div', {
      left: (opt.w * 0.50 - lw / 2) + 'px', top: neckY + 'px',
      width: lw + 'px', height: (hipY - neckY + 4) + 'px', background: c
    }, el, 'body');

    var armL = mk('div', {
      left: (opt.w * 0.50 - lw / 2 - lw * 1.1) + 'px', top: (neckY + 6) + 'px',
      width: (lw - 1) + 'px', height: (opt.h * 0.26) + 'px', background: c
    }, el, 'arm');
    var armR = mk('div', {
      left: (opt.w * 0.50 + lw / 2 + lw * 0.1) + 'px', top: (neckY + 6) + 'px',
      width: (lw - 1) + 'px', height: (opt.h * 0.26) + 'px', background: c
    }, el, 'arm');

    var head = mk('div', {
      left: (opt.w * 0.50 - headR) + 'px', top: (neckY - headR * 2 - 2) + 'px',
      width: (headR * 2) + 'px', height: (headR * 2) + 'px', background: c
    }, el, 'head');

    return {
      el: el, legL: legL, legR: legR, armL: armL, armR: armR,
      body: body, head: head, shadow: shadow,
      baseTop: opt.y, baseLeft: opt.x, h: opt.h, w: opt.w,
      hipY: hipY, neckY: neckY
    };
  }

  /* =========================================================
     THE FOUR CHILDREN
     same age, same second, four different starting conditions.
     ========================================================= */

  /* 1 — white house: lifted onto the piano bench, held up by the rail */
  var K1 = buildKid({
    x: 300, y: 74, w: 74, h: 132, limb: 9,
    color: '#2a2420', shadow: 'rgba(90,70,40,0.35)'
  });

  /* 2 — stairwell: sits on a step, waits for a door that is not his */
  var K2 = buildKid({
    x: 500, y: 268 + 112, w: 68, h: 122, limb: 8,
    color: '#cfd8d2', shadow: 'rgba(0,0,0,0.55)'
  });

  /* 3 — tin shack: crouches by the crates, small on purpose */
  var K3 = buildKid({
    x: 700, y: 536 + 128, w: 62, h: 112, limb: 8,
    color: '#e6dccb', shadow: 'rgba(0,0,0,0.50)'
  });

  /* 4 — store back door: stands under the neon, weight on one leg */
  var K4 = buildKid({
    x: 1450, y: 804 + 96, w: 76, h: 136, limb: 9,
    color: '#f2d9e8', shadow: 'rgba(255,79,168,0.20)'
  });

  var KIDS = [K1, K2, K3, K4];

  /* a fifth pair of hands: the parent who lifts K1. appears, then leaves. */
  var P1 = buildKid({
    x: 232, y: 46, w: 92, h: 168, limb: 11,
    color: '#4a4038', shadow: 'rgba(90,70,40,0.25)'
  });

  /* give every child a resting pose so nothing is a blank stick */
  function rest(k, lean) {
    gsap.set(k.legL, { rotation: lean || 0 });
    gsap.set(k.legR, { rotation: -(lean || 0) });
    gsap.set(k.armL, { rotation: 8 });
    gsap.set(k.armR, { rotation: -8 });
  }
  rest(K1, 3); rest(K2, 6); rest(K3, 10); rest(K4, 2);

  /* K3 is crouching: squash the whole figure a little */
  gsap.set(K3.el, { scaleY: 0.82, transformOrigin: '50% 100%' });

  /* =========================================================
     scenery that behaves like people: light, dust, neon, rain-ish dust
     ========================================================= */

  /* dust drifting through the band 1 sunlight */
  var dustHost = K1.el.parentNode;
  var dust = [];
  for (var i = 0; i < 26; i++) {
    var d = mk('div', {
      position: 'absolute',
      left: rnd(920, 1880) + 'px',
      top: rnd(-30, 240) + 'px',
      width: rnd(2, 4) + 'px',
      height: rnd(2, 4) + 'px',
      borderRadius: '50%',
      background: 'rgba(255,244,214,0.75)',
      opacity: rnd(0.15, 0.55).toFixed(2),
      zIndex: 15
    }, dustHost);
    dust.push(d);
  }

  /* band 2: a second bulb further down the corridor that flickers out */
  var bulb2 = mk('div', {
    position: 'absolute', left: '1500px', top: '128px',
    width: '14px', height: '14px', borderRadius: '50%',
    background: '#ffe9a8', boxShadow: '0 0 24px 7px rgba(255,220,140,0.45)', zIndex: 12
  }, B.b2);

  /* band 3: a leak running down the sheet metal */
  var leak = mk('div', {
    position: 'absolute', left: '760px', top: '0px', width: '3px', height: '150px',
    background: 'linear-gradient(180deg, rgba(180,205,220,0) 0%, rgba(180,205,220,0.55) 70%, rgba(180,205,220,0.15) 100%)',
    filter: 'blur(0.6px)', zIndex: 12
  }, B.b3);

  /* band 4: a stray cat, or the shape of one, that crosses once */
  var cat = mk('div', {
    position: 'absolute', left: '0px', top: '196px', width: '46px', height: '22px',
    background: '#3a2f42', borderRadius: '11px 11px 4px 4px', zIndex: 15, opacity: 0.85
  }, B.b4);
  mk('div', {
    position: 'absolute', left: '34px', top: '-8px', width: '14px', height: '14px',
    borderRadius: '50%', background: '#3a2f42'
  }, cat);

  
  /* ---- id pass for the p3 props ---- */
  bulb2.id = 'bulb2';
  leak.id = 'leak';
  cat.id = 'cat';

  /* the two figures the timeline needs but nothing has built yet */
  var runner = mk('div', {
    position: 'absolute', left: '-120px', top: '120px', width: '46px', height: '96px',
    background: 'rgba(0,0,0,0.55)', borderRadius: '22px 22px 6px 6px'
  }, $('b4'), 'runner');
  runner.id = 'runner';

  var handoff = mk('div', {
    position: 'absolute', left: '120px', top: '70px', width: '96px', height: '10px',
    background: 'rgba(120,96,70,0.65)', borderRadius: '5px'
  }, $('b1'), 'handoff');
  handoff.id = 'handoff';

  var doorlight = mk('div', {
    position: 'absolute', left: '160px', top: '150px', width: '220px', height: '110px',
    background: 'radial-gradient(ellipse at 50% 100%, rgba(255,214,140,0.9), rgba(255,214,140,0) 70%)',
    opacity: 0
  }, $('b4'), 'doorlight');
  doorlight.id = 'doorlight';

  gsap.set(['#runner', '#handoff'], { opacity: 0 });

/* the seams breathe: they are the only thing the four lives share */
  var seamGlow = [];
  ['s1', 's2', 's3'].forEach(function (id) {
    seamGlow.push($(id));
  });
/* =========================================================
   TIMELINE  /  first half: 0 - 22s
   same clock, four lives. every beat lands on the same frame.
   ========================================================= */
  var tl = gsap.timeline({ paused: true });

  /* ---- 0.0 : black fades up ---- */
  tl.to('#black', { opacity: 0, duration: 1.6, ease: 'power2.out' }, 0);

  /* ---- 0.6 : the four shadows arrive before the four bodies ---- */
  KIDS.forEach(function (k, i) {
    tl.from(k.shadow, { opacity: 0, duration: 1.0, ease: 'power1.out' }, 0.6 + i * 0.12);
  });

  /* ---- 1.2 : K1 is lifted. the parent's hands come from above. ---- */
  tl.from(P1.el, { opacity: 0, y: -26, duration: 1.1, ease: 'power2.out' }, 1.2);
  tl.from(K1.el, { y: 40, opacity: 0, duration: 1.4, ease: 'power3.out' }, 1.2);
  tl.to(K1.el, { y: '-=34', duration: 3.2, ease: 'sine.inOut' }, 3.0);
  tl.to(P1.el, { y: '-=34', duration: 3.2, ease: 'sine.inOut' }, 3.0);
  tl.to(K1.armL, { rotation: -18, duration: 1.6, ease: 'sine.inOut' }, 3.4);
  tl.to(K1.armR, { rotation: 18, duration: 1.6, ease: 'sine.inOut' }, 3.4);

  /* ---- 1.6 : K2 stands on the stairs. the bulb above it stutters. ---- */
  tl.from(K2.el, { opacity: 0, duration: 1.6, ease: 'power1.out' }, 1.6);

  tl.to([K1.el, K2.el, K3.el, K4.el], { opacity: 0.35, duration: 2.4, ease: 'sine.in' }, 42.0);

  tl.to('#black', { opacity: 1, duration: 1.6, ease: 'power1.in' }, 43.4);
