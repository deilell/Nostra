name: build-ios

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    # 公开仓库的 macOS runner 免费
    runs-on: macos-13
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          echo "== 可用 Xcode =="
          ls /Applications | grep -i xcode || true
          # 优先 15.x，回退到 runner 默认
          if [ -d /Applications/Xcode_15.2.app ]; then
            sudo xcode-select -s /Applications/Xcode_15.2.app/Contents/Developer
          elif [ -d /Applications/Xcode_15.1.app ]; then
            sudo xcode-select -s /Applications/Xcode_15.1.app/Contents/Developer
          elif [ -d /Applications/Xcode_15.0.app ]; then
            sudo xcode-select -s /Applications/Xcode_15.0.app/Contents/Developer
          else
            echo "使用 runner 默认 Xcode"
          fi
          xcodebuild -version

      - name: Setup Flutter 3.16.9
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.16.9
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos || true

      - name: Build iOS (no codesign)
        run: |
          flutter build ios --release --no-codesign

      - name: Package unsigned .app
        run: |
          cd build/ios/iphoneos
          ls -la
          mkdir -p Payload
          cp -R Runner.app Payload/
          zip -qry nostra-unsigned.ipa Payload

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nostra-unsigned-ipa
          path: build/ios/iphoneos/nostra-unsigned.ipa
          if-no-files-found: error