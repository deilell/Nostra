name: render-vibeds7
on:
  workflow_dispatch:
  push:
    paths:
      - 'vibeds7/**'
      - '.github/workflows/render-vibeds7.yml'
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HYPERFRAMES_TELEMETRY: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg && ffmpeg -version | head -1
      - name: Install CJK fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk fonts-noto-cjk-extra || sudo apt-get install -y fonts-noto-cjk || true
          fc-cache -f >/dev/null 2>&1 || true
          fc-list :lang=zh | head -5
      - name: Install Chromium deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libasound2t64 || sudo apt-get install -y libasound2 || true
          sudo apt-get install -y libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libpango-1.0-0 libcairo2 || true
      - name: Install hyperframes
        working-directory: vibeds7
        run: npm install -D hyperframes
      - name: Lint
        working-directory: vibeds7
        run: npx hyperframes lint 2>&1 | tee /tmp/lint.log || true
      - name: Render
        working-directory: vibeds7
        run: npx hyperframes render 2>&1 | tee /tmp/render.log
      - name: Collect output
        working-directory: vibeds7
        run: |
          mkdir -p out
          SRC=$(find . -name "*.mp4" -not -path "./node_modules/*" | head -1)
          echo "SRC=$SRC"
          if [ -z "$SRC" ]; then echo "NO MP4 PRODUCED"; ls -R . | head -50; exit 1; fi
          cp "$SRC" out/final.mp4
          ls -l out/
      - name: Verify final
        working-directory: vibeds7
        run: |
          ffprobe -hide_banner -show_entries format=duration,size,bit_rate -show_entries stream=codec_type,codec_name,width,height,r_frame_rate out/final.mp4
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: r7-logs
          path: |
            /tmp/lint.log
            /tmp/render.log
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: r7-four-kids
          path: vibeds7/out/final.mp4
          if-no-files-found: warn