name: render-vibeds6-self

on:
  workflow_dispatch:
  push:
    paths:
      - 'vibeds6-self/**'
      - '.github/workflows/render-vibeds6-self.yml'

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HYPERFRAMES_TELEMETRY: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg

      - name: Install Chromium deps
        run: |
          sudo apt-get install -y libasound2t64 || sudo apt-get install -y libasound2 || true
          sudo apt-get install -y \
            libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 \
            libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libpango-1.0-0 \
            libcairo2 libasound2t64 || true

      - name: Install hyperframes
        working-directory: vibeds6-self
        run: npm install -D hyperframes

      - name: Lint
        working-directory: vibeds6-self
        run: npx hyperframes lint || true

      - name: Render
        working-directory: vibeds6-self
        run: npx hyperframes render 2>&1 | tee /tmp/render.log

      - name: Collect output
        working-directory: vibeds6-self
        run: |
          mkdir -p out
          find . -name '*.mp4' -not -path './node_modules/*' -exec cp {} out/ \;
          ls -l out/
          ffprobe -v error -show_entries format=duration -of default=nw=1 out/*.mp4 || true

      - uses: actions/upload-artifact@v4
        with:
          name: r3v-why-am-i
          path: vibeds6-self/out/*.mp4
          if-no-files-found: warn